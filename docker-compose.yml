services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Santiago
      - RUNNING_IN_DOCKER=1
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/crear-reserva-chat
      - N8N_CANCELACION_WEBHOOK_URL=http://n8n:5678/webhook/cancelar-reserva
      - N8N_CREACION_WEBHOOK_URL=http://n8n:5678/webhook/confirmar-reserva
      - N8N_EDICION_WEBHOOK_URL=http://n8n:5678/webhook/editar-reserva
    env_file:
      - backend/backend.env
    depends_on:
      - n8n
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - TZ=America/Santiago
    depends_on:
      - backend
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Santiago
      - GENERIC_TIMEZONE=America/Santiago
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
