services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Santiago
      - RUNNING_IN_DOCKER=1
      - N8N_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/crear-reserva-chat
      - N8N_CANCELACION_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/cancelar-reserva
      - N8N_CREACION_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/confirmar-reserva
      - N8N_EDICION_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/editar-reserva
      - N8N_CONTACTO_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/contacto-soporte
      - N8N_REGLAMENTO_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/consultar-reglamento
      - N8N_TALLER_RESPUESTA_WEBHOOK_URL=http://uct-botsbiblioteca-dev-n8n-1:5678/webhook/responder-taller
      - MSSQL_HOST=botsbiblioteca-sqlserver-dev
    env_file:
      - backend/backend.env
    depends_on:
      n8n:
        condition: service_healthy
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - uct-botsbiblioteca-dev-backend-1
          - botsbiblioteca-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - TZ=America/Santiago
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - default

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Santiago
      - GENERIC_TIMEZONE=America/Santiago
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://botsbiblioteca.dev.uct.cl/n8n/
      - WEBHOOK_URL=https://botsbiblioteca.dev.uct.cl/n8n/
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - uct-botsbiblioteca-dev-n8n-1
          - botsbiblioteca-n8n

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: prototipo-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlAdmin2026!
      - MSSQL_PID=Developer
      - TZ=America/Santiago
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      default:
        aliases:
          - botsbiblioteca-sqlserver-dev

volumes:
  n8n_data:
  sqlserver_data:

networks:
  default:
